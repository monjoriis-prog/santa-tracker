    <g transform="translate(50,60)">
      <path d="M-7 3 C-13 9 -17 13 -22 12 M6 3 C12 9 16 14 21 13" stroke="#8C5C38" stroke-width="2.7" fill="none" stroke-linecap="round"/>
      <circle cx="-22" cy="12" r="1.7" fill="#40301F"/><circle cx="21" cy="13" r="1.7" fill="#40301F"/>
      <ellipse cx="0" cy="0" rx="15" ry="6.6" fill="#A9714B"/>
      <circle cx="10" cy="-1" r="7" fill="#9C6540"/>
      <circle cx="-9" cy="0" r="6.2" fill="#A9714B"/>
      <ellipse cx="-1" cy="3" rx="10" ry="2.6" fill="#C89A6E" opacity="0.65"/>
      <path d="M-11 -3 Q-13 -9 -17 -13 L-12 -17 Q-8 -11 -5 -6 Z" fill="#A9714B"/>
      <ellipse cx="-14" cy="-19.5" rx="3.4" ry="1.8" fill="#8C5C38" transform="rotate(-40 -14 -19.5)"/>
