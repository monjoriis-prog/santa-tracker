      <path class="sleigh-scroll" d="M-27 -6 Q-39 -12 -33 -21 Q-28 -27 -21 -21" stroke="#C0334E" stroke-width="3.6" fill="none" stroke-linecap="round"/>
      <path d="M-14 -6 C-8 -12 0 -10 2 -4 C3 0 -2 2 -4 -1 C-5 -3 -3 -5 -1 -4" stroke="#FAC775" stroke-width="1.2" fill="none" opacity="0.9" stroke-linecap="round"/>
      <path d="M-26 -7 L-8 -16 L30 -16" stroke="#FAC775" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <!-- gift sack -->
      <path d="M8 -21 Q6 -35 18 -36 Q30 -35 28 -21 Z" fill="#6B4A2F"/>
      <path d="M8 -21 Q6 -35 18 -36 Q22 -35 20 -21 Z" fill="#7D5838"/>
      <rect x="10" y="-33" width="8.5" height="6.5" rx="1" fill="#1D9E75"/>
