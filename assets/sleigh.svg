      <rect x="20" y="-31" width="7" height="5.5" rx="1" fill="#D4537E"/>
      <path d="M23.5 -31 L23.5 -25.5" stroke="#FAEEDA" stroke-width="1"/>
      <!-- santa -->
      <path d="M-12 -14 Q-19 -13 -20 -9.5 L-13 -9 Z" fill="#3A2A20"/>
      <path d="M-11 -15 Q-14 -30 -2 -31 Q10 -30 7 -15 Z" fill="#E24B4A"/>
      <rect x="-11.5" y="-17" width="19" height="3.2" rx="1.6" fill="#FFFFFF"/>
      <rect x="-11" y="-24.5" width="18" height="4.2" fill="#3A2A20"/>
      <rect x="-3.6" y="-25" width="5.2" height="5.2" rx="1" fill="#FAC775"/>
      <path d="M-3 -28 Q-13 -28 -20 -24" stroke="#E24B4A" stroke-width="5.6" fill="none" stroke-linecap="round"/>
      <circle cx="-18.5" cy="-25" r="2.7" fill="#FFFFFF"/>
      <circle cx="-22" cy="-23.5" r="3" fill="#3A2A20"/>
      <circle cx="0" cy="-35" r="5.4" fill="#F0BFA0"/>
      <circle cx="-3.4" cy="-33.4" r="1.7" fill="#F0997B" opacity="0.75"/>
      <path d="M-5.4 -35 Q-6 -24 0 -24 Q6 -24 5.4 -35 Q0 -31 -5.4 -35 Z" fill="#FFFFFF"/>
      <ellipse cx="-2" cy="-33.4" rx="2.6" ry="1.4" fill="#FFFFFF"/>
      <ellipse cx="2" cy="-33.4" rx="2.6" ry="1.4" fill="#FFFFFF"/>
      <circle cx="-2.8" cy="-37.2" r="0.9" fill="#2C2C2A"/>
      <path d="M-6 -41 Q-3 -52 8 -50 Q14 -49 11 -43 Q9 -40.5 7.5 -41.5 Z" fill="#E24B4A"/>
      <rect x="-7.4" y="-42.8" width="15.5" height="4" rx="2" fill="#FFFFFF"/>
      <circle cx="12.6" cy="-43" r="3" fill="#FFFFFF"/>
