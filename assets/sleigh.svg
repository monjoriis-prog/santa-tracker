    <!-- sparkle trail -->
    <g fill="#FAC775" opacity="0.7">
      <path d="M226 46 l1.2 3 3 1.2 -3 1.2 -1.2 3 -1.2 -3 -3 -1.2 3 -1.2 Z"/>
      <path d="M235 62 l0.9 2.2 2.2 0.9 -2.2 0.9 -0.9 2.2 -0.9 -2.2 -2.2 -0.9 2.2 -0.9 Z"/>
      <path d="M222 74 l0.7 1.8 1.8 0.7 -1.8 0.7 -0.7 1.8 -0.7 -1.8 -1.8 -0.7 1.8 -0.7 Z"/>
    </g>

  </g>
</svg>
