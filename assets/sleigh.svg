      <path d="M-16 -18 C-18 -24 -22 -26 -25 -31 M-18.5 -23 L-24 -25 M-21 -26.5 L-26 -29 M-13 -17 C-12 -24 -9 -27 -8 -32 M-12.5 -23 L-7 -25 M-10 -27 L-5 -29" stroke="#E8DCC8" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      <circle cx="-22" cy="-16.5" r="1.5" fill="#FFFFFF"/><circle cx="-22.4" cy="-16.5" r="0.9" fill="#2C2C2A"/>
      <circle cx="-30" cy="-15.5" r="2.4" fill="#E24B4A"/><circle cx="-30.8" cy="-16.4" r="0.8" fill="#F09595"/>
      <path d="M-11 -6 Q-8 0 -9 5" stroke="#BA7517" stroke-width="2.2" fill="none"/>
      <circle cx="-10" cy="3.5" r="1.9" fill="#FAC775"/><circle cx="-10.6" cy="-0.5" r="1.5" fill="#FAC775"/>
      <path d="M-5 4 C-9 11 -11 15 -16 15 M5 4 C9 11 11 15 16 16" stroke="#B87F52" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <circle cx="-16" cy="15" r="1.7" fill="#40301F"/><circle cx="16" cy="16" r="1.7" fill="#40301F"/>
      <path d="M15 -4 Q22 -8 19 1" fill="#A9714B"/>
