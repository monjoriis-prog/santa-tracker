<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 110" width="240" height="110" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Santa sleigh and reindeer team</title>
  <desc>Two reindeer with branching antlers and harness bells pull an ornate sleigh carrying Santa and a sack of gifts. Faces left.</desc>

  <!-- Inline the #rig group into your map SVG.
       Position with transform="translate(x,y)"; add scale(0.42) for map size.
       Reference it a second time anywhere with <use href="#rig"/>.
       Customizer colour: set fill on .sleigh-body and stroke on .sleigh-scroll. -->

  <g id="rig">

    <!-- rear reindeer, darker and dimmed for depth -->
    <g transform="translate(108,64)" opacity="0.8">
      <path d="M-7 3 C-13 9 -17 13 -22 12 M6 3 C12 9 16 14 21 13" stroke="#6E4A2E" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="0" cy="0" rx="14.5" ry="6.4" fill="#8A5A33"/>
      <circle cx="10" cy="-1" r="6.8" fill="#7E5130"/>
      <circle cx="-9" cy="0" r="6" fill="#8A5A33"/>
      <path d="M-11 -3 Q-13 -9 -17 -13 L-12 -17 Q-8 -11 -5 -6 Z" fill="#8A5A33"/>
      <path d="M-14 -15 Q-19 -21 -26 -19 Q-31 -18 -30 -14.5 Q-29 -11.5 -23 -11.8 Q-16 -12 -14 -15 Z" fill="#96633A"/>
      <path d="M-16 -18 C-18 -24 -22 -26 -25 -31 M-18.5 -23 L-24 -25 M-13 -17 C-12 -24 -9 -27 -8 -32 M-12.5 -23 L-7 -25" stroke="#D8CAB0" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <circle cx="-30" cy="-15.5" r="2.2" fill="#C43F3E"/>
      <path d="M-5 4 C-9 11 -11 15 -16 15 M5 4 C9 11 11 15 16 16" stroke="#96633A" stroke-width="2.7" fill="none" stroke-linecap="round"/>
      <path d="M15 -4 Q22 -8 19 1" fill="#8A5A33"/>
    </g>

