<!-- Landing hero: colourful snowy village, detailed moon, sleigh crossing, falling snowflakes.
     Palette: sky #0A2140 -> #123A66 -> #1D5488 -> #2E74A8 (lit horizon so buildings read),
     snow #B7D2E8 / #D6E7F5 / #F4F9FD, windows #FFD277, string lights 5 colours.
     Sleigh crosses the full width and passes through the middle of the moon; it is a dark
     silhouette with a warm outline so it reads on the dark sky and on the pale moon alike.
     Front row: six gabled houses, saturated, with shaded side walls, doors and wreaths.
     Back row is cooler, smaller and desaturated for depth. Church spire in the back row.
     Put the <section> in index.html, the <style> in styles.css, the <script> in hero.js. -->

<style>
.hero { position:relative; border-radius:16px; overflow:hidden; background:#0A2140; }
.hero svg { display:block; width:100%; height:auto; }
.hero-copy { position:absolute; left:0; right:0; top:8%; text-align:center; padding:0 24px; text-shadow:0 2px 12px rgba(6,16,36,.9), 0 0 26px rgba(6,16,36,.7); }
.hero-title { margin:0; font-size:clamp(30px,5.2vw,52px); font-weight:600; color:#FFF6EC; letter-spacing:-0.5px; }
.hero-sub { margin:10px 0 0; font-size:clamp(14px,1.9vw,18px); color:#D8E7F4; }
.hero-btn { margin-top:22px; background:#E24B4A; color:#FFF6EC; border:none; border-radius:999px; padding:14px 30px; font-size:16px; font-weight:600; cursor:pointer; }
.hero-btn:focus-visible { outline:3px solid #FFD277; outline-offset:3px; }
.hero-count { margin:14px 0 0; font-size:14px; color:#FFD277; }
@keyframes fall { to { transform: translateY(470px) } }
@keyframes sway { 0%,100% { transform: translateX(-9px) } 50% { transform: translateX(9px) } }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes twk { 0%,100% { opacity:.25 } 50% { opacity:1 } }
@keyframes cross { 0% { transform: translate(920px,172px) } 24% { transform: translate(636px,126px) } 100% { transform: translate(-260px,84px) } }
@keyframes wisp { 0% { transform: translate(0,0) scale(.5); opacity:0 } 22% { opacity:.6 } 70% { opacity:.3 } 100% { transform: translate(-11px,-28px) scale(1.05); opacity:0 } }
@keyframes glow { 0%,100% { opacity:1 } 50% { opacity:.62 } }
.sk { animation: cross 20s linear infinite; }
.flake { transform-box: fill-box; transform-origin: center; }
.wisp { transform-box: fill-box; transform-origin: 50% 100%; }
@media (prefers-reduced-motion: reduce) { .sk,.sn,.sw,.flake,.wisp,.bulb,.win { animation:none !important }
  .wisp { opacity:.4 } }
</style>

<script>
(function(){
  var ns='http://www.w3.org/2000/svg';
  function el(t,a){ var e=document.createElementNS(ns,t); for(var k in a) e.setAttribute(k,a[k]); return e; }

  var st=document.getElementById('stars');
  for(var i=0;i<55;i++){
    var c=el('circle',{cx:(Math.random()*800).toFixed(1),cy:(Math.random()*230).toFixed(1),r:(Math.random()*1.2+0.4).toFixed(1),fill:'#DCE8F7'});
    c.style.animation='twk '+(2+Math.random()*3).toFixed(1)+'s ease-in-out infinite';
    c.style.animationDelay=(Math.random()*4).toFixed(1)+'s'; st.appendChild(c);
  }

  // bulbs sample the swag path so they sit exactly on the wire
  var swag=document.getElementById('swag'), bg=document.getElementById('bulbs');
  var cols=['#FF6B6B','#FFD277','#5DCAA5','#7FB3D5','#F49BC1'];
  var L=swag.getTotalLength();
  for(var b=0;b<26;b++){
    var p=swag.getPointAtLength(L*(b+0.5)/26);
    bg.appendChild(el('line',{x1:p.x.toFixed(1),y1:p.y.toFixed(1),x2:p.x.toFixed(1),y2:(p.y+3).toFixed(1),stroke:'#2B3F5E','stroke-width':'1'}));
    var bulb=el('circle',{cx:p.x.toFixed(1),cy:(p.y+5).toFixed(1),r:3.4,fill:cols[b%cols.length]});
    bulb.setAttribute('class','bulb');
    bulb.style.animation='glow '+(1.8+Math.random()*2).toFixed(1)+'s ease-in-out infinite';
    bulb.style.animationDelay=(Math.random()*2).toFixed(1)+'s'; bg.appendChild(bulb);
  }

  document.querySelectorAll('.win').forEach(function(w){
    w.style.animation='glow '+(3+Math.random()*4).toFixed(1)+'s ease-in-out infinite';
    w.style.animationDelay=(Math.random()*4).toFixed(1)+'s';
  });

  // chimney smoke: wavy ribbons that rise, drift left and fade. Each sits in its own
  // positioning wrapper so the CSS transform animation has a clean element to drive.
  var curls=[
    'M0 0 C -5 -6, 5 -11, 0 -17 C -5 -23, 4 -27, -1 -31',
    'M0 0 C 5 -6, -5 -11, 0 -17 C 5 -23, -4 -27, 1 -31',
    'M0 0 C -4 -7, 5 -12, 1 -18 C -4 -24, 4 -28, 0 -32'
  ];
  var sm=document.getElementById('smoke');
  [[110,304],[386,298],[652,304]].forEach(function(p,idx){
    for(var j=0;j<4;j++){
      var pos=el('g',{transform:'translate('+p[0]+','+p[1]+')'});
      var w=el('path',{d:curls[j%curls.length],stroke:'#D8E6F3',fill:'none','stroke-width':(2.2+Math.random()).toFixed(1),'stroke-linecap':'round',opacity:'0'});
      w.setAttribute('class','wisp');
      w.style.animation='wisp '+(3+j*0.3).toFixed(1)+'s ease-out infinite';
      w.style.animationDelay=(j*0.8+idx*0.4).toFixed(1)+'s';
      pos.appendChild(w); sm.appendChild(pos);
    }
  });

  var FLAKE='M0 -6 L0 6 M-5.2 -3 L5.2 3 M-5.2 3 L5.2 -3 M0 -3.6 L-1.7 -5.2 M0 -3.6 L1.7 -5.2 M0 3.6 L-1.7 5.2 M0 3.6 L1.7 5.2 M-3.1 -1.8 L-4.5 -1.1 M-3.1 -1.8 L-3.3 -3.4 M3.1 1.8 L4.5 1.1 M3.1 1.8 L3.3 3.4 M-3.1 1.8 L-4.5 1.1 M-3.1 1.8 L-3.3 3.4 M3.1 -1.8 L4.5 -1.1 M3.1 -1.8 L3.3 -3.4';
  var sn=document.getElementById('snow');
  for(var k=0;k<78;k++){
    var x=(Math.random()*800).toFixed(1), y=(-Math.random()*80).toFixed(1);
    var pos=el('g',{transform:'translate('+x+','+y+')'});
    var outer=el('g',{});
    outer.setAttribute('class','sn');
    outer.style.animation='fall '+(8+Math.random()*10).toFixed(1)+'s linear infinite';
    outer.style.animationDelay=(Math.random()*12).toFixed(1)+'s';
    var mid=el('g',{});
    mid.setAttribute('class','sw');
    mid.style.animation='sway '+(3+Math.random()*4).toFixed(1)+'s ease-in-out infinite';
    mid.style.animationDelay=(Math.random()*4).toFixed(1)+'s';
    var shape;
    if(Math.random()<0.45){
      var s=(0.35+Math.random()*0.55).toFixed(2);
      shape=el('path',{d:FLAKE,stroke:'#FFFFFF',fill:'none','stroke-width':(1.5/s).toFixed(2),'stroke-linecap':'round',transform:'scale('+s+')',opacity:(0.55+Math.random()*0.4).toFixed(2)});
      shape.setAttribute('class','flake');
      shape.style.animation='spin '+(9+Math.random()*14).toFixed(1)+'s linear infinite';
    } else {
      shape=el('circle',{cx:0,cy:0,r:(Math.random()*1.7+0.7).toFixed(1),fill:'#FFFFFF',opacity:(0.45+Math.random()*0.45).toFixed(2)});
    }
    mid.appendChild(shape); outer.appendChild(mid); pos.appendChild(outer); sn.appendChild(pos);
  }
})();
</script>
